# LeJEPA classic exactly as in the phase-1 course code (src/train.py LeJEPAMeter, commit 52aa283),
# with the hyper-parameters of the phase-1 runs (results/phase1_meter/classic/*/logs/ssl/*/hparams.yaml).
variant: classic
lambd: 0.05
n_global: 2
global_size: 256
global_scale: [0.3, 1.0]
n_local: 6
local_size: 128
local_scale: [0.05, 0.3]
by_dataset:             # phase 1 used wider crops on NYU (src/dataset.py get_ssl_transform)
  nyu: {global_scale: [0.5, 1.0], local_scale: [0.15, 0.5]}
solarize_p: 0.0
proj_dims: [256, 512, 64]
proj_norm: layernorm
centre: all             # mean over all 8 views
sigreg_input: flat      # one SIGReg over the 8 x B projections
clamp: 100.0
encode_views: per_view  # one encoder forward per view (BatchNorm statistics per view)
num_slices: 256
epps_points: 21
epps_t_max: 5.0
lr: 5.0e-4
weight_decay: 5.0e-2
epochs: 50
warmup_epochs: 10
eta_min_ratio: 1.0e-3
