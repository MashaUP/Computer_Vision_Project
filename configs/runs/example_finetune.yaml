# Example: step 3, frozen LeJEPA-dense encoder, decoder trained with ground truth (option B).
task: finetune
name: finetune_flexdepth_nyu_dense_seed0
model: flexdepth
variant: n
dataset: nyu
init: lejepa                # random | lejepa | public
encoder_ckpt: /work/runs/pretrain_flexdepth_nyu_dense/encoder.pt
loss: silog
train_list: splits/nyu_labeled_train.txt   # con NYU raw va sostituita con la lista raw+depth
# val_list: da definire dopo l'allineamento depth NYU raw (scene escluse da train e test)
image_size: [256, 320]
epochs: 25
lr: 1.0e-4
weight_decay: 1.0e-2
batch_size: 16
seed: 0
