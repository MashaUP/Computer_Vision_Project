# Example: step 3 for ZipDepth, frozen LeJEPA-dense encoder, decoder trained with ZipDepth's own loss
# (SSI median/MAD + gradient matching) on Depth Anything V2 Large pseudo-depth, as in its original training.
# Pseudo-depth first: python scripts/make_pseudo_depth.py --dataset nyu --list splits/nyu_raw_triplets_train.txt
task: finetune
name: finetune_zipdepth_nyu_dense_zip_seed0
model: zipdepth
variant: base
dataset: nyu
init: lejepa                # random | lejepa | public
encoder_ckpt: /work/runs/pretrain_zipdepth_nyu_dense/encoder.pt
loss: zipdepth
pseudo_teacher: dav2_vitl   # <data root>/pseudo_depth/dav2_vitl/
train_list: splits/nyu_raw_triplets_train.txt   # same frames as the photometric runs (middle frame of each triplet)
val_list: splits/nyu_labeled_val.txt            # validated after scale-and-shift (affine-invariant output)
image_size: [288, 384]
epochs: 25
lr: 1.0e-4
weight_decay: 1.0e-2
batch_size: 16
seed: 0
